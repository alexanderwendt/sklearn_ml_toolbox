[workflow]
version = 1
engine = "tabular"
output = "_reruns"
inputs = ["data_raw/grade_reg.csv"]
code = ["steps"]

[defaults.data]
path = "data_raw/grade_reg.csv"
prepare = "builtin:grades"

[defaults.split]
strategy = "random"
test_size = 0.2

[defaults.training]
seed = 42
models = ["ols", "linear", "lasso", "elastic_net", "forest", "svm", "svm_linear", "knn", "xgboost"]
folds = 5
search_iterations = 10

[defaults.analysis]
methods = ["pca", "tsne", "umap", "lasso", "tree", "recursive", "backward", "correlation"]
max_samples = 1000

[profiles.regression.data]
task = "regression"
target = "GPA"
drop = ["StudentID", "GradeClass"]
