[data]
path = "data_raw/Student_performance_data.csv"
target = "GradeClass"
task = "classification"
drop = ["StudentID", "GPA"]
prepare = "builtin:grades"

[split]
strategy = "random"
test_size = 0.2

[training]
seed = 42
models = ["linear", "forest", "svm", "svm_linear", "knn", "gnb", "xgboost"]
folds = 5
search_iterations = 10

[output]
directory = "results/classification_all"
