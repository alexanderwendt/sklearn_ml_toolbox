[data]
path = "data_raw/Student_performance_data.csv"
target = "GPA"
task = "regression"
drop = ["StudentID", "GradeClass"]
prepare = "builtin:grades"

[split]
strategy = "random"
test_size = 0.2

[training]
seed = 42
models = ["linear", "forest"]
folds = 3
search_iterations = 3

[output]
directory = "results/regression"
