# One invocation runs both tasks; all outputs go into a new isolated _reruns folder.
[workflow]
version = 1
engine = "tabular"
output = "_reruns"
inputs = ["data_raw/Student_performance_data.csv"]

[defaults.data]
path = "data_raw/Student_performance_data.csv"
prepare = "builtin:grades"

[defaults.split]
strategy = "random"
test_size = 0.2

[defaults.training]
seed = 42
models = ["svm", "xgboost", "svm_linear", "knn", "gnb"]
folds = 5
search_iterations = 10

[defaults.analysis]
methods = ["pca", "tsne", "umap", "lasso", "tree", "recursive", "backward", "correlation"]
max_samples = 1000

[profiles.classification.data]
task = "classification"
target = "GradeClass"
drop = ["StudentID", "GPA"]

[profiles.regression.data]
task = "regression"
target = "GPA"
drop = ["StudentID", "GradeClass"]

[profiles.regression.training]
# Gaussian Naive Bayes is classification-only.
models = ["linear", "forest", "svm", "svm_linear", "knn", "xgboost"]
