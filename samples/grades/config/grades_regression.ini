[Common]
#Common values for all files like dataset name and class and mode to be used
dataset_name=grades
class_name=GPA
problem_type=regression

[Paths]
#File paths for output directory
project_directory=./samples/grades
results_directory=${project_directory}/results
prepared_data_directory=${project_directory}/data_prepared
models_directory=${project_directory}/models
log_directory=${project_directory}/logs
config_directory=${project_directory}/config

source_path=${project_directory}/data_raw/Student_performance_data.csv
#No labels for regression
labels_path=

[Generation]
#Generation of features and outcomes
features_out=${Paths:prepared_data_directory}/features_raw.csv
outcomes_out=${Paths:prepared_data_directory}/outcomes_raw.csv
source_out=${Paths:prepared_data_directory}/source.csv

[Preparation]
#Data cleaning and split
source_in=${Generation:source_out}
features_in=${Generation:features_out}
outcomes_in=${Generation:outcomes_out}
binarize_labels=False
#Split into training and validation data
test_size=0.20
shuffle_data=True
#Outputs
features_out=${Paths:prepared_data_directory}/features.csv
features_out_train=${Paths:prepared_data_directory}/features_train.csv
features_out_val=${Paths:prepared_data_directory}/features_val.csv
outcomes_out=${Paths:prepared_data_directory}/outcomes.csv
outcomes_out_train=${Paths:prepared_data_directory}/outcomes_train.csv
outcomes_out_val=${Paths:prepared_data_directory}/outcomes_val.csv
labels_out=${Paths:prepared_data_directory}/labels.csv
selected_feature_columns_out=${Paths:prepared_data_directory}/selected_feature_columns.csv

[Training]
#Training parameters
features_train_in=${Preparation:features_out_train}
outcomes_train_in=${Preparation:outcomes_out_train}
features_val_in=${Preparation:features_out_val}
outcomes_val_in=${Preparation:outcomes_out_val}
selected_feature_columns_in=${Preparation:selected_feature_columns_out}

pipeline_class=model_param_svm_regression
pipeline_out=${Paths:models_directory}/pipeline.pickle
model_out=${Paths:models_directory}/model.joblib

# Scorers for regression: neg_mean_squared_error, neg_mean_absolute_error, r2
refit_scorer_name=r2
subset_share=0.5
max_features=20

# Narrow search parameters (for SVR fine tuning if implemented)
narrow_samples=[0.1, 0.2, 0.5]
narrow_kfolds=[3, 5, 5]
narrow_iterations=[100, 200, 500]
narrow_selection=[10, 20, 20]

[Model]
features_in=${Preparation:features_out_train}
outcomes_in=${Preparation:outcomes_out_train}
labels_in=${Paths:labels_path}
pipeline_in=${Training:pipeline_out}
model_out=${Paths:models_directory}/final_model.joblib
title=FinalModel

[EvaluationTraining]
features_in=${Preparation:features_out_val}
outcomes_in=${Preparation:outcomes_out_val}
labels_in=${Paths:labels_path}
model_in=${Model:model_out}
ext_param_in=./samples/grades/models/model_ext_parameters.json
title=EvaluationTraining
